[project]
name = "aerocommand-backend"
version = "1.0.0"
description = "AeroCommand – Cloud Drone & Robot Fleet Management Platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "orjson>=3.9",
    "aiomqtt>=2.0",
    "redis[hiredis]>=5.0",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

